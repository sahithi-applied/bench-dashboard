global:
  poll_interval_s: 10
  server:
    host: 0.0.0.0
    port: 5000

benches:
  # --- Palm Proto HW Benches (S32K + S32Z) ---

  - name: elpaso
    hostname: elpaso-hw-bench-5
    ip: 10.80.11.28
    ssh: {host: 10.80.11.28, user: dev, sudo_user: bk}
    buildkite:
      service: buildkite-agent-bk.service
      agent_name: elpaso-hw-bench-5
      queue: fw_hil
    devices:
      usb_hubs:
        - name: "Hub 2 — DUT Relays / PCAN / LabJack"
          serial_path: /dev/serial/by-id/usb-StarTech.com_5G4AINDRM-USB-A-HUB_B0B7K2U4-if00-port0
          ports:
            - "DUT Relays 0 (AH05I4ZX) — power/boot"
            - "Hub 5 (PCAN0-3)"
            - "LabJack T7"
            - "Unused"
        - name: "Hub 1 — S32Z Debugger / Relay Hub / Serials"
          serial_path: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_B001P1EX-if00-port0
          ports:
            - "S32Z CodeWarrior TAP debugger"
            - "Hub 4 (WDT Relays AH05I53H + SENT gateway)"
            - "Hub 3 (PeMicro, MCU/SMU/RTU serials)"
            - "Unused"
      relay_boards:
        - name: "DUT Relays 0 — Power / Boot"
          identifier: AH05I4ZX
          powered_by: {hub_index: 0, port: 0}
          channels:
            - {label: main_12v, inverted: true, default: false}
            - {label: wdg_dbg_fs26, inverted: true, default: true}
            - {label: boot_mod_1, inverted: false, default: false}
            - {label: boot_mod_2, inverted: false, default: false}
        - name: "WDT Relays — FS86 / PF50"
          identifier: AH05I53H
          powered_by: {hub_index: 1, port: 1}
          channels:
            - {label: wdg_dbg_fs86, inverted: true, default: true}
            - {label: wdg_dbg_pf50, inverted: false, default: true}
            - {label: unused_ch2, inverted: false, default: false}
            - {label: unused_ch3, inverted: false, default: false}
      serial_devices:
        - {name: "MCU S32K Debug Serial", identifier: AU0K41SH, powered_by: {hub_index: 1, port: 2}}
        - {name: "RTU S32Z Debug Serial", identifier: AU0K3DGT, powered_by: {hub_index: 1, port: 2}}
        - {name: "SMU S32Z Debug Serial", identifier: AB0L6LBL, powered_by: {hub_index: 1, port: 2}}
        - {name: "SENT Gateway", identifier: MACH_SYSTEMS, powered_by: {hub_index: 1, port: 1}}
        - {name: "S32Z CodeWarrior TAP", identifier: CodeWarrior_TAP, powered_by: {hub_index: 1, port: 0}}
      labjack_devices:
        - name: "LabJack T7"
          powered_by: {hub_index: 0, port: 2}
      ethernet_devices:
        - name: "FL3x FlexRay Analyzer"
          interface: enp0s20f0u1u1c2
          device_ip: 192.168.1.15

