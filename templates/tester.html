<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hardware Tester</title>
  <style>
    :root {
      --bg:#0f1117; --card-bg:#1a1d27; --border:#2d3148;
      --text:#e2e8f0; --muted:#8892a4;
      --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --blue:#3b82f6; --gray:#4b5563;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text);
           font-family:'JetBrains Mono',ui-monospace,monospace; font-size:13px; }

    header {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 24px; border-bottom:1px solid var(--border);
      background:var(--card-bg); position:sticky; top:0; z-index:10;
    }
    .header-left h1 { font-size:14px; font-weight:600; }
    .header-left .meta { font-size:10px; color:var(--muted); margin-top:2px; }
    .back { font-size:11px; color:var(--muted); text-decoration:none; margin-right:10px; }
    .back:hover { color:var(--text); }

    .connect-bar { display:flex; align-items:center; gap:8px; }
    .ip-input {
      background:#1f2937; border:1px solid var(--border); border-radius:6px;
      color:var(--text); font-family:inherit; font-size:12px;
      padding:7px 12px; width:200px;
    }
    .ip-input:focus { outline:none; border-color:var(--blue); }
    .connect-btn {
      background:#1e3a5f; border:1px solid var(--blue); border-radius:6px;
      color:#60a5fa; cursor:pointer; font-family:inherit;
      font-size:12px; font-weight:600; padding:7px 16px;
    }
    .connect-btn:hover { background:#1e4a7f; }
    .connect-btn:disabled { opacity:0.5; cursor:not-allowed; }
    .connected-label {
      display:none; align-items:center; gap:6px;
      font-size:11px; color:var(--green);
    }
    .pulse { width:8px; height:8px; border-radius:50%;
             background:var(--green); animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .disc-btn {
      background:none; border:none; color:var(--muted);
      cursor:pointer; font-size:11px; margin-left:8px; font-family:inherit;
    }
    .disc-btn:hover { color:var(--text); }

    main { padding:20px 24px; display:flex; flex-direction:column; gap:24px; }

    .section-title {
      font-size:10px; font-weight:700; letter-spacing:0.1em;
      text-transform:uppercase; color:var(--muted); margin-bottom:12px;
    }

    /* Device status grid */
    .status-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
    .status-card {
      background:var(--card-bg); border:1px solid var(--border);
      border-radius:8px; padding:14px;
    }
    .status-card-title { font-size:12px; font-weight:600; margin-bottom:3px; }
    .status-card-sub { font-size:10px; color:var(--muted); margin-bottom:10px; line-height:1.5; }
    .status-ok { color:var(--green); font-size:11px; font-weight:700; }
    .status-missing { color:var(--red); font-size:11px; font-weight:700; }
    .status-unknown { color:var(--muted); font-size:11px; }

    /* Test cards */
    .run-all-row {
      display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;
    }
    .run-all-btn {
      background:#1e3a5f; border:1px solid var(--blue); border-radius:6px;
      color:#60a5fa; cursor:pointer; font-family:inherit;
      font-size:12px; font-weight:600; padding:7px 16px;
    }
    .run-all-btn:hover { background:#1e4a7f; }

    .test-cards { display:flex; flex-direction:column; gap:14px; }
    .test-card {
      background:var(--card-bg); border:1px solid var(--border);
      border-radius:8px; overflow:hidden;
    }
    .test-card-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px; border-bottom:1px solid var(--border);
    }
    .test-card-name { font-size:13px; font-weight:600; }
    .test-card-sub { font-size:10px; color:var(--muted); margin-top:2px; }
    .badge {
      font-size:10px; font-weight:700; letter-spacing:0.06em;
      padding:2px 8px; border-radius:4px; text-transform:uppercase; white-space:nowrap;
    }
    .badge-ok { background:#14532d; color:var(--green); }
    .badge-missing { background:#450a0a; color:var(--red); }
    .badge-unknown { background:#1f2937; color:var(--muted); }

    .test-rows { padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
    .test-row { display:grid; grid-template-columns:180px 90px 1fr; align-items:start; gap:12px; }
    .test-btn {
      background:#1f2937; border:1px solid var(--border); border-radius:5px;
      color:var(--text); cursor:pointer; font-family:inherit;
      font-size:11px; font-weight:600; padding:6px 12px; text-align:left;
      transition:background 0.15s; white-space:nowrap;
    }
    .test-btn:hover { background:#2d3148; }
    .test-btn:disabled { opacity:0.4; cursor:not-allowed; }
    .test-status { font-size:10px; font-weight:700; padding:4px 0; white-space:nowrap; }
    .ts-pass { color:var(--green); }
    .ts-fail { color:var(--red); }
    .ts-error { color:var(--amber); }
    .ts-running { color:var(--blue); }
    .ts-notrun { color:var(--muted); }
    .test-detail { font-size:10px; color:var(--muted); line-height:1.6; }
    .test-detail .tin { color:#60a5fa; }
    .test-detail .tok { color:var(--green); }
    .test-detail .tfail { color:var(--red); }

    /* Summary */
    .summary-bar {
      background:var(--card-bg); border:1px solid var(--border);
      border-radius:8px; padding:12px 16px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .summary-counts { display:flex; gap:16px; font-size:11px; }
    .export-btn {
      background:#1f2937; border:1px solid var(--border); border-radius:5px;
      color:var(--muted); cursor:pointer; font-family:inherit; font-size:11px; padding:6px 14px;
    }
    .export-btn:hover { color:var(--text); border-color:var(--text); }

    /* Empty state */
    .empty {
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; min-height:300px; gap:12px; color:var(--muted);
    }
    .empty-icon { font-size:32px; opacity:0.4; }
    .recent-label { font-size:10px; text-transform:uppercase; letter-spacing:0.1em; margin-top:16px; }
    .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .chip {
      background:#1f2937; border:1px solid var(--border); border-radius:4px;
      color:var(--muted); cursor:pointer; font-size:10px; padding:4px 10px;
    }
    .chip:hover { color:var(--text); border-color:var(--blue); }
    .spinner { display:inline-block; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Denkovi manual relay control */
    .denkovi-row {
      display:grid; grid-template-columns:70px 130px 1fr; align-items:center; gap:12px;
    }
    .denkovi-led {
      display:inline-block; width:10px; height:10px; border-radius:50%;
      margin-right:8px; vertical-align:middle;
    }
    .denkovi-led-on { background:var(--green); box-shadow:0 0 6px var(--green); }
    .denkovi-led-off { background:var(--gray); }
    .denkovi-led-unknown { background:var(--muted); }
    .denkovi-onoff-btn {
      border-radius:5px; cursor:pointer; font-family:inherit;
      font-size:11px; font-weight:600; padding:6px 14px;
    }
    .denkovi-on-btn { background:#14532d; border:1px solid var(--green); color:var(--green); }
    .denkovi-on-btn:hover { background:#166534; }
    .denkovi-off-btn { background:#450a0a; border:1px solid var(--red); color:var(--red); margin-left:6px; }
    .denkovi-off-btn:hover { background:#5a0d0d; }

    /* LabJack toggle/DAC rows */
    .labjack-read-row {
      display:grid; grid-template-columns:1fr 90px 1fr; align-items:center; gap:10px;
    }
    .labjack-toggle-row {
      display:grid; grid-template-columns:1fr 70px 70px 1fr; align-items:center; gap:10px;
    }
    .labjack-dac-row {
      display:grid; grid-template-columns:1fr 60px 70px 70px 1fr; align-items:center; gap:10px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1><a class="back" href="/hub">← Hub</a>Hardware Tester</h1>
      <div class="meta">Connect to any machine · SSH via esi-dashboard key</div>
    </div>
    <div class="connect-bar" id="connect-bar">
      <input class="ip-input" type="text" id="target-ip" placeholder="10.80.10.57" value="">
      <input class="ip-input" style="width:100px" type="text" id="target-user" placeholder="ssh user" value="dev">
      <button class="connect-btn" id="connect-btn" onclick="connectToMachine()">Connect</button>
    </div>
    <div class="connected-label" id="connected-label">
      <span class="pulse"></span>
      <span id="connected-ip">—</span>
      <button class="disc-btn" onclick="disconnect()">Disconnect</button>
    </div>
  </header>

  <!-- EMPTY STATE -->
  <main id="empty-state">
    <div class="empty">
      <div class="empty-icon">🔌</div>
      <p>Enter a target machine IP above to begin</p>
      <div class="recent-label">Recent machines</div>
      <div class="chips">
        <span class="chip" onclick="setIp('10.80.10.57')">10.80.10.57 — mnemosyne</span>
        <span class="chip" onclick="setIp('10.80.10.98')">10.80.10.98 — jericho</span>
        <span class="chip" onclick="setIp('10.80.11.28')">10.80.11.28 — elpaso</span>
      </div>
    </div>
  </main>

  <!-- CONNECTED STATE -->
  <main id="connected-state" style="display:none;">

    <!-- Device Status -->
    <section>
      <div class="section-title">Device Status — Auto Discovered</div>
      <div class="status-grid" id="status-grid">
        <div class="status-card" style="color:var(--muted);font-size:11px;">Scanning…</div>
      </div>
    </section>

    <!-- Functional Tests -->
    <section>
      <div class="run-all-row">
        <div class="section-title" style="margin-bottom:0;">Functional Tests</div>
        <button class="run-all-btn" onclick="runAllTests()">Run All Tests</button>
      </div>
      <div class="test-cards" id="test-cards" style="margin-top:12px;"></div>
    </section>

    <!-- Summary Bar -->
    <div class="summary-bar" id="summary-bar">
      <div class="summary-counts" id="summary-counts">
        <span>0 not run</span>
      </div>
      <button class="export-btn" onclick="exportReport()">Export Report</button>
    </div>

  </main>

  <script>
    let _host = '';
    let _user = 'dev';
    let _discovered = {};
    let _results = {};
    let _tests = {};

    // neoVI FIRE 3 channel-role -> DUT signal/connector, from core-stack's
    // hil_benches.pkl (mnemosyne_bench fire3 config) -- same High Pine 1.0
    // harness design/wiring across all these benches, so this mapping holds
    // regardless of which specific neoVI serial is plugged in.
    const INTREPID_CAN_MAP = {
      hscan:   {signal: 'CAN_1',  connector: 'J10'},
      hscan2:  {signal: 'CAN_2',  connector: 'J10'},
      hscan3:  {signal: 'CAN_3',  connector: 'J15'},
      hscan4:  {signal: 'CAN_4',  connector: 'J15'},
      hscan5:  {signal: 'CAN_5',  connector: 'J9'},
      hscan6:  {signal: 'CAN_6',  connector: 'J9'},
      hscan7:  {signal: 'CAN_7',  connector: 'J15'},
      mscan:   {signal: 'CAN_8',  connector: 'J15'},
      dwcan09: {signal: 'CAN_9',  connector: 'J10'},
      dwcan10: {signal: 'CAN_10', connector: 'J10'},
    };

    function intrepidCanLabel(iface) {
      const m = iface.match(/^(.*)_([0-9A-Za-z]{6})$/);
      const role = m ? m[1] : iface;
      const mapped = INTREPID_CAN_MAP[role];
      return mapped ? `${mapped.signal} (${mapped.connector})` : iface;
    }

    // LabJack AIN0-13 -> DUT signal. Click-verified against the schematic PDF
    // (each wire traced to its actual endpoint, not just visual proximity --
    // several entries here corrected an earlier proximity-based guess that
    // turned out wrong). Cross-referenced with LabJack T7's fixed FIO/EIO-to-AIN
    // pinout (FIO0-7 = AIN0-7, EIO0-5 = AIN8-13). Divider_5/9/10 (EIO6-7,
    // CIO0-3) are excluded entirely -- those pins have no AIN alias on a T7,
    // so HSD0_QM_A_OUT_8, MSDI_DIG_IN_0, FHB_OUT_L/H_4, eFUSE0_ASIL_OUT, and
    // eFUSE0_QM_OUT aren't reachable via AIN naming regardless of wiring.
    const LABJACK_AIN_MAP = [
      {channel: 'AIN0',  pin: 'FIO0', signal: 'HSD2_ASIL_C_OUT_1', connector: 'J15'},
      {channel: 'AIN1',  pin: 'FIO1', signal: 'HSD2_ASIL_D_OUT_0',  connector: ''},
      {channel: 'AIN2',  pin: 'FIO2', signal: 'FHB_OUT_L_0', connector: 'J9'},
      {channel: 'AIN3',  pin: 'FIO3', signal: 'FHB_OUT_H_0', connector: 'J9'},
      {channel: 'AIN4',  pin: 'FIO4', signal: 'eFUSE3_QM_OUT0', connector: 'J10'},
      {channel: 'AIN5',  pin: 'FIO5', signal: 'eFUSE3_QM_OUT1', connector: 'J10'},
      {channel: 'AIN6',  pin: 'FIO6', signal: 'eFUSE3_ASIL_OUT0', connector: 'J12'},
      {channel: 'AIN7',  pin: 'FIO7', signal: 'eFUSE3_ASIL_OUT1', connector: 'J12'},
      {channel: 'AIN8',  pin: 'EIO0', signal: 'HSD0_QM_B_OUT_0', connector: 'J14'},
      {channel: 'AIN9',  pin: 'EIO1', signal: 'HSD0_QM_B_OUT_1', connector: 'J14'},
      {channel: 'AIN10', pin: 'EIO2', signal: 'HSD1_QM_D_OUT_0', connector: 'J10'},
      {channel: 'AIN11', pin: 'EIO3', signal: 'LSD_QM_OUT0',      connector: ''},
      {channel: 'AIN12', pin: 'EIO4', signal: 'MSDI_DIG_IN_1',    connector: ''},
      {channel: 'AIN13', pin: 'EIO5', signal: 'MSDI_DIG_IN_2',    connector: ''},
    ];

    function labjackChannelLabel(ch) {
      return ch.connector ? `${ch.signal} (${ch.connector})` : ch.signal;
    }

    // Both confirmed via click-tracing. These stimulate DUT *inputs*
    // (ADC_CONN_IN_1 / MSDI_CONN_ADC_IN_0), separate/unrelated to the AIN
    // channels above which monitor DUT *outputs* -- no shared node with AIN11.
    const LABJACK_DAC_MAP = [
      {channel: 'DAC0', signal: 'MSDI_CONN_ADC_IN_0'},
      {channel: 'DAC1', signal: 'ADC_CONN_IN_1'},
    ];

    async function runLabjackRead(channel, signalLabel) {
      const statusEl = document.getElementById(`lj-read-status-${channel}`);
      const detailEl = document.getElementById(`lj-read-detail-${channel}`);
      statusEl.className = 'test-status ts-running';
      statusEl.textContent = '⟳ Reading…';
      detailEl.textContent = '';
      try {
        const res = await fetch('/api/tester/run', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({host: _host, user: _user, test: 'labjack_read',
            params: {channel, signal_label: signalLabel}}),
        });
        const data = await res.json();
        const cls = {pass:'ts-pass', fail:'ts-fail', error:'ts-error'}[data.status] || 'ts-notrun';
        const icon = {pass:'● PASS', fail:'✗ FAIL', error:'⚠ Error'}[data.status] || '○';
        statusEl.className = 'test-status ' + cls;
        statusEl.textContent = icon;
        detailEl.innerHTML = (data.output ? `<span class="tok">${data.output}</span>` : '') +
                              (data.error ? `<br><span class="tfail">${data.error}</span>` : '');
      } catch(e) {
        statusEl.className = 'test-status ts-error';
        statusEl.textContent = '⚠ Error';
        detailEl.textContent = String(e);
      }
    }

    async function runLabjackToggle(channel, signalLabel) {
      const durSel = document.getElementById(`lj-toggle-dur-${channel}`);
      const duration_s = parseInt(durSel.value, 10);
      const statusEl = document.getElementById(`lj-toggle-status-${channel}`);
      const detailEl = document.getElementById(`lj-toggle-detail-${channel}`);
      statusEl.className = 'test-status ts-running';
      statusEl.textContent = `⟳ Holding HIGH ${duration_s}s…`;
      detailEl.textContent = '';
      try {
        const res = await fetch('/api/tester/run', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({host: _host, user: _user, test: 'labjack_toggle',
            params: {channel, signal_label: signalLabel, duration_s}}),
        });
        const data = await res.json();
        const cls = {pass:'ts-pass', fail:'ts-fail', error:'ts-error'}[data.status] || 'ts-notrun';
        const icon = {pass:'● PASS', fail:'✗ FAIL', error:'⚠ Error'}[data.status] || '○';
        statusEl.className = 'test-status ' + cls;
        statusEl.textContent = icon;
        detailEl.innerHTML = (data.output ? `<span class="tok">${data.output}</span>` : '') +
                              (data.error ? `<br><span class="tfail">${data.error}</span>` : '');
      } catch(e) {
        statusEl.className = 'test-status ts-error';
        statusEl.textContent = '⚠ Error';
        detailEl.textContent = String(e);
      }
    }

    async function runLabjackDac(dacChannel, signalLabel) {
      const voltsEl = document.getElementById(`lj-dac-volts-${dacChannel}`);
      const durSel = document.getElementById(`lj-dac-dur-${dacChannel}`);
      const voltage = parseFloat(voltsEl.value);
      const duration_s = parseInt(durSel.value, 10);
      const statusEl = document.getElementById(`lj-dac-status-${dacChannel}`);
      const detailEl = document.getElementById(`lj-dac-detail-${dacChannel}`);
      statusEl.className = 'test-status ts-running';
      statusEl.textContent = `⟳ Outputting ${voltage}V for ${duration_s}s…`;
      detailEl.textContent = '';
      try {
        const res = await fetch('/api/tester/run', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({host: _host, user: _user, test: 'labjack_dac',
            params: {dac_channel: dacChannel, voltage, signal_label: signalLabel, duration_s}}),
        });
        const data = await res.json();
        const cls = {pass:'ts-pass', fail:'ts-fail', error:'ts-error'}[data.status] || 'ts-notrun';
        const icon = {pass:'● PASS', fail:'✗ FAIL', error:'⚠ Error'}[data.status] || '○';
        statusEl.className = 'test-status ' + cls;
        statusEl.textContent = icon;
        detailEl.innerHTML = (data.output ? `<span class="tok">${data.output}</span>` : '') +
                              (data.error ? `<br><span class="tfail">${data.error}</span>` : '');
      } catch(e) {
        statusEl.className = 'test-status ts-error';
        statusEl.textContent = '⚠ Error';
        detailEl.textContent = String(e);
      }
    }

    function setIp(ip) {
      document.getElementById('target-ip').value = ip;
    }

    async function connectToMachine() {
      const ip = document.getElementById('target-ip').value.trim();
      if (!ip) return;
      _host = ip;
      _user = document.getElementById('target-user').value.trim() || 'dev';
      const btn = document.getElementById('connect-btn');
      btn.disabled = true;
      btn.textContent = 'Connecting…';

      try {
        const res = await fetch('/api/tester/connect', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({host: ip, user: _user}),
        });
        const data = await res.json();
        if (data.error) { alert('Connection failed: ' + data.error); return; }
        _discovered = data;
        showConnected(ip, data);
      } catch(e) {
        alert('Failed: ' + e);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Connect';
      }
    }

    function showConnected(ip, data) {
      document.getElementById('connect-bar').style.display = 'none';
      const lbl = document.getElementById('connected-label');
      lbl.style.display = 'flex';
      document.getElementById('connected-ip').textContent = _user + '@' + ip;
      document.getElementById('empty-state').style.display = 'none';
      document.getElementById('connected-state').style.display = 'flex';
      renderStatusGrid(data);
      renderTestCards(data);
      updateSummary();
    }

    function disconnect() {
      _host = ''; _discovered = {}; _results = {}; _tests = {};
      document.getElementById('connect-bar').style.display = 'flex';
      document.getElementById('connected-label').style.display = 'none';
      document.getElementById('empty-state').style.display = 'flex';
      document.getElementById('connected-state').style.display = 'none';
      document.getElementById('target-ip').value = '';
    }

    function renderStatusGrid(data) {
      const grid = document.getElementById('status-grid');
      const cards = [];

      if (data.usb_hubs && data.usb_hubs.length)
        cards.push(`<div class="status-card">
          <div class="status-card-title">StarTech Hubs</div>
          <div class="status-card-sub">${data.usb_hubs.length} control port(s):<br>${data.usb_hubs.map(h=>h.name).join('<br>')}</div>
          <div class="status-ok">● OK</div></div>`);

      if (data.sainsmart_relays && data.sainsmart_relays.length)
        cards.push(`<div class="status-card">
          <div class="status-card-title">Sainsmart Relays</div>
          <div class="status-card-sub">${data.sainsmart_relays.map(r=>r.identifier).join(', ')}</div>
          <div class="status-ok">● OK</div></div>`);

      if (data.denkovi && data.denkovi.length)
        data.denkovi.forEach(d => cards.push(`<div class="status-card">
          <div class="status-card-title">Denkovi Relay</div>
          <div class="status-card-sub">${d.host}</div>
          <div class="status-ok">● OK</div></div>`));

      if (data.intrepid && data.intrepid.length)
        data.intrepid.forEach(i => cards.push(`<div class="status-card">
          <div class="status-card-title">Intrepid NeoVI</div>
          <div class="status-card-sub">Serial: ${i.serial_number}<br>${i.interfaces.slice(0,2).join(', ')}</div>
          <div class="status-ok">● OK</div></div>`));

      if (data.labjack && data.labjack.length)
        cards.push(`<div class="status-card">
          <div class="status-card-title">LabJack T7</div>
          <div class="status-card-sub">${data.labjack.length} found</div>
          <div class="status-ok">● OK</div></div>`);

      if (data.serial_devices && data.serial_devices.length)
        cards.push(`<div class="status-card">
          <div class="status-card-title">Serial Devices</div>
          <div class="status-card-sub">${data.serial_devices.length} found</div>
          <div class="status-ok">● OK</div></div>`);

      if (!cards.length)
        cards.push(`<div class="status-card"><div class="status-unknown">No devices discovered</div></div>`);

      grid.innerHTML = cards.join('');
    }

    function renderTestCards(data) {
      const container = document.getElementById('test-cards');
      const cards = [];
      _tests = {}; _results = {};

      // Intrepid CAN + LIN tests
      (data.intrepid || []).forEach(dev => {
        const ifaces = dev.interfaces || [];
        const rows = [];

        if (ifaces.length >= 2)
          rows.push(makeTestRow('can_loopback', 'Test CAN Loopback',
            {tx_iface: ifaces[0], rx_iface: ifaces[1]},
            `can-${dev.serial_number}`));

        // One CAN Alive row per real CAN channel (excludes eth/flxr channels,
        // which carry FlexRay/other traffic, not CAN) -- listens for real bus
        // traffic rather than bridging two arbitrary channels.
        ifaces.filter(i => /can/i.test(i)).forEach(iface =>
          rows.push(makeTestRow('can_alive', `Test CAN Alive — ${intrepidCanLabel(iface)}`,
            {iface, bitrate: 500000, duration_s: 3},
            `can-alive-${dev.serial_number}-${iface}`)));

        // Pre-flash CAN wiring check: sends one frame ourselves and checks
        // the resulting bus error-state (bus-off vs error-active) rather
        // than requiring a real response -- meaningful even with no DUT
        // firmware transmitting yet.
        ifaces.filter(i => /can/i.test(i)).forEach(iface =>
          rows.push(makeTestRow('can_bus_health', `Test CAN Bus Health — ${intrepidCanLabel(iface)}`,
            {iface, bitrate: 500000},
            `can-health-${dev.serial_number}-${iface}`)));

        // Pre-flash wiring sanity check: neoVI acts as LIN master and
        // transmits itself (LIN is master-polled, nothing to passively
        // listen for without DUT firmware). Checks electrical fault flags,
        // not DUT-side continuity.
        rows.push(makeTestRow('lin_alive', 'Test LIN Master (neoVI)',
          {serial_number: dev.serial_number, frame_id: 1},
          `lin-alive-${dev.serial_number}`));

        cards.push(`<div class="test-card">
          <div class="test-card-header">
            <div><div class="test-card-name">Intrepid NeoVI Fire 3</div>
            <div class="test-card-sub">Serial: ${dev.serial_number} · ${ifaces.slice(0,3).join(', ')}</div></div>
            <span class="badge badge-ok">OK</span>
          </div>
          <div class="test-rows">${rows.join('')}</div></div>`);
      });

      // Denkovi manual relay control — direct ON/OFF per channel with live LED state
      (data.denkovi || []).forEach(dev => {
        const rows = Array.from({length: 16}, (_, ch) => ch).map(ch => `
          <div class="denkovi-row" id="denkovi-row-${dev.host}-${ch}">
            <div><span class="denkovi-led denkovi-led-unknown" id="denkovi-led-${dev.host}-${ch}"></span>Q${ch + 1}</div>
            <div>
              <button class="denkovi-onoff-btn denkovi-on-btn" onclick="setDenkoviChannel('${dev.host}', ${ch}, true)">ON</button>
              <button class="denkovi-onoff-btn denkovi-off-btn" onclick="setDenkoviChannel('${dev.host}', ${ch}, false)">OFF</button>
            </div>
            <div class="test-detail" id="denkovi-state-${dev.host}-${ch}">Unknown</div>
          </div>`);
        cards.push(`<div class="test-card">
          <div class="test-card-header">
            <div><div class="test-card-name">Denkovi smartDEN IP-16R</div>
            <div class="test-card-sub">${dev.host} · 16 channels</div></div>
            <span class="badge badge-ok">OK</span>
          </div>
          <div class="test-rows">${rows.join('')}</div></div>`);
      });

      // Sainsmart relay tests
      (data.sainsmart_relays || []).forEach(relay => {
        const rows = [0,1].map(ch =>
          makeTestRow('relay_toggle', `Test Toggle CH${ch}`,
            {identifier: relay.identifier, channel_idx: ch},
            `relay-${relay.identifier}-ch${ch}`));
        cards.push(`<div class="test-card">
          <div class="test-card-header">
            <div><div class="test-card-name">Sainsmart Relay</div>
            <div class="test-card-sub">ID: ${relay.identifier}</div></div>
            <span class="badge badge-ok">OK</span>
          </div>
          <div class="test-rows">${rows.join('')}</div></div>`);
      });

      // Hub tests — discovery returns the FTDI control serial path per hub
      if ((data.usb_hubs || []).length) {
        const rows = (data.usb_hubs || []).map((hub, i) =>
          makeTestRow('hub_port_cycle', `Test Port Cycle Hub ${i+1}`,
            {serial_path: hub.serial_path, port_idx: 0},
            `hub-${i}-p0`));
        cards.push(`<div class="test-card">
          <div class="test-card-header">
            <div><div class="test-card-name">StarTech USB Hubs</div>
            <div class="test-card-sub">${data.usb_hubs.map(h=>h.name).join(' · ')}</div></div>
            <span class="badge badge-ok">OK</span>
          </div>
          <div class="test-rows">${rows.join('')}</div></div>`);
      }

      // LabJack
      if ((data.labjack || []).length) {
        const readRows = LABJACK_AIN_MAP.map(ch => `
          <div class="labjack-read-row" id="lj-read-row-${ch.channel}">
            <button class="test-btn" onclick="runLabjackRead('${ch.channel}', '${labjackChannelLabel(ch)}')">
              Read ${ch.pin} — ${labjackChannelLabel(ch)}
            </button>
            <div class="test-status ts-notrun" id="lj-read-status-${ch.channel}">○ Not run</div>
            <div class="test-detail" id="lj-read-detail-${ch.channel}"></div>
          </div>`).join('');

        const toggleRows = LABJACK_AIN_MAP.map(ch => `
          <div class="labjack-toggle-row" id="lj-toggle-row-${ch.pin}">
            <button class="test-btn" onclick="runLabjackToggle('${ch.pin}', '${labjackChannelLabel(ch)}')">
              Toggle ${ch.pin} — ${labjackChannelLabel(ch)}
            </button>
            <select class="ip-input" style="width:70px;padding:6px 8px;font-size:11px;" id="lj-toggle-dur-${ch.pin}">
              <option value="10">10s</option>
              <option value="20">20s</option>
              <option value="30">30s</option>
            </select>
            <div class="test-status ts-notrun" id="lj-toggle-status-${ch.pin}">○ Not run</div>
            <div class="test-detail" id="lj-toggle-detail-${ch.pin}"></div>
          </div>`).join('');

        const dacRows = LABJACK_DAC_MAP.map(ch => `
          <div class="labjack-dac-row" id="lj-dac-row-${ch.channel}">
            <button class="test-btn" onclick="runLabjackDac('${ch.channel}', '${ch.signal}')">
              Output ${ch.channel} — ${ch.signal}
            </button>
            <input class="ip-input" style="width:60px;padding:6px 8px;font-size:11px;" type="number" step="0.1" min="0" max="5" value="3.3" id="lj-dac-volts-${ch.channel}">
            <select class="ip-input" style="width:70px;padding:6px 8px;font-size:11px;" id="lj-dac-dur-${ch.channel}">
              <option value="10">10s</option>
              <option value="20">20s</option>
              <option value="30">30s</option>
            </select>
            <div class="test-status ts-notrun" id="lj-dac-status-${ch.channel}">○ Not run</div>
            <div class="test-detail" id="lj-dac-detail-${ch.channel}"></div>
          </div>`).join('');

        cards.push(`<div class="test-card">
          <div class="test-card-header">
            <div><div class="test-card-name">LabJack T7</div>
            <div class="test-card-sub">USB · Analog I/O</div></div>
            <span class="badge badge-ok">OK</span>
          </div>
          <div class="test-rows">
            ${makeTestRow('labjack_voltage', 'Test Voltage Read (AIN0–13)', {}, 'labjack-ain')}
          </div>
          <div style="padding:0 16px 4px;font-size:10px;color:var(--muted);border-top:1px solid var(--border);margin-top:4px;padding-top:10px;">
            PASSIVE READ — per-channel, no driving. Matches how this circuit is actually used: DUT drives, LabJack measures.
          </div>
          <div class="test-rows">${readRows}</div>
          <div style="padding:0 16px 4px;font-size:10px;color:var(--muted);border-top:1px solid var(--border);margin-top:4px;padding-top:10px;">
            DIGITAL TOGGLE — drives 3.3V/0V, hold duration for multimeter probing
          </div>
          <div class="test-rows">${toggleRows}</div>
          <div style="padding:0 16px 4px;font-size:10px;color:var(--muted);border-top:1px solid var(--border);margin-top:4px;padding-top:10px;">
            DAC ANALOG OUTPUT — real voltage, not just digital high/low
          </div>
          <div class="test-rows">${dacRows}</div>
          </div>`);
      }

      // LIN communication (PCAN-USB Pro FD)
      cards.push(`<div class="test-card">
        <div class="test-card-header">
          <div><div class="test-card-name">LIN Bus — PCAN-USB Pro FD</div>
          <div class="test-card-sub">plin driver · /dev/plin/ · 19200 baud</div></div>
          <span class="badge badge-unknown">Not checked</span>
        </div>
        <div class="test-rows">
          ${makeTestRow('lin_check', 'Check LIN Interfaces', {}, 'lin-ifaces')}
          ${makeTestRow('lin_communication', 'Test LIN Communication',
            {baudrate: 19200, timeout_s: 5}, 'lin-comm')}
        </div></div>`);

      // FlexRay
      cards.push(`<div class="test-card">
        <div class="test-card-header">
          <div><div class="test-card-name">FL3x FlexRay Analyzer</div>
          <div class="test-card-sub">192.168.1.15:1500 · Ethernet · libHwCom.so</div></div>
          <span class="badge badge-unknown">Not checked</span>
        </div>
        <div class="test-rows">
          ${makeTestRow('flexray_check', 'Check Reachability',
            {device_ip: '192.168.1.15', interface: 'enp0s20f0u1u1c2'}, 'fl3x-ping')}
          ${makeTestRow('flexray_connectivity', 'Test Device Connectivity',
            {device_ip: '192.168.1.15', device_port: 1500, channel: 1}, 'fl3x-conn')}
          ${makeTestRow('flexray_analyzer', 'Test Frame Capture (needs DUT)',
            {device_ip: '192.168.1.15', device_port: 1500, channel: 1}, 'fl3x-frames')}
        </div></div>`);

      container.innerHTML = cards.join('') || '<div style="color:var(--muted);font-size:11px;">No testable devices discovered</div>';

      (data.denkovi || []).forEach(dev => refreshDenkoviState(dev.host));
    }

    let _denkoviState = {};   // denkovi_host -> array of 16 booleans (null = unknown)

    async function refreshDenkoviState(denkoviHost) {
      try {
        const res = await fetch('/api/tester/denkovi/state', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({host: _host, user: _user, denkovi_host: denkoviHost}),
        });
        const data = await res.json();
        if (data.status === 'ok') {
          _denkoviState[denkoviHost] = data.channel_states;
          data.channel_states.forEach((_, ch) => updateDenkoviRow(denkoviHost, ch));
        }
      } catch(e) { /* leave as unknown */ }
    }

    function updateDenkoviRow(denkoviHost, ch) {
      const states = _denkoviState[denkoviHost];
      const state = states ? states[ch] : null;
      const led = document.getElementById(`denkovi-led-${denkoviHost}-${ch}`);
      const label = document.getElementById(`denkovi-state-${denkoviHost}-${ch}`);
      if (!led || !label) return;
      if (state === null || state === undefined) {
        led.className = 'denkovi-led denkovi-led-unknown';
        label.textContent = 'Unknown';
      } else {
        led.className = 'denkovi-led ' + (state ? 'denkovi-led-on' : 'denkovi-led-off');
        label.textContent = state ? 'ON' : 'OFF';
      }
    }

    async function setDenkoviChannel(denkoviHost, ch, state) {
      const label = document.getElementById(`denkovi-state-${denkoviHost}-${ch}`);
      if (label) label.textContent = 'Setting…';
      try {
        const res = await fetch('/api/tester/denkovi/set', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({host: _host, user: _user, denkovi_host: denkoviHost, channel_idx: ch, state}),
        });
        const data = await res.json();
        if (!data.ok) {
          alert('Failed to set Q' + (ch + 1) + ': ' + (data.error || 'unknown error'));
        }
      } catch(e) {
        alert('Failed to set Q' + (ch + 1) + ': ' + e);
      }
      await refreshDenkoviState(denkoviHost);
    }

    function makeTestRow(testName, label, params, key) {
      _results[key] = {status:'not_run'};
      _tests[key] = {testName, params};
      return `<div class="test-row" id="row-${key}">
        <button class="test-btn" onclick="runTest('${key}')">${label}</button>
        <div class="test-status ts-notrun" id="status-${key}">○ Not run</div>
        <div class="test-detail" id="detail-${key}"></div>
      </div>`;
    }

    async function runTest(key) {
      const {testName, params} = _tests[key];
      const statusEl = document.getElementById('status-' + key);
      const detailEl = document.getElementById('detail-' + key);
      statusEl.className = 'test-status ts-running';
      statusEl.textContent = '⟳ Running';
      detailEl.textContent = '';

      try {
        const res = await fetch('/api/tester/run', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({host: _host, user: _user, test: testName, params}),
        });
        const data = await res.json();
        _results[key] = data;
        renderTestResult(key, data);
      } catch(e) {
        _results[key] = {status: 'error'};
        statusEl.className = 'test-status ts-error';
        statusEl.textContent = '⚠ Error';
        detailEl.textContent = String(e);
      }
      updateSummary();
    }

    function renderTestResult(key, data) {
      const statusEl = document.getElementById('status-' + key);
      const detailEl = document.getElementById('detail-' + key);
      const s = data.status;
      const cls = {pass:'ts-pass',fail:'ts-fail',error:'ts-error'}[s] || 'ts-notrun';
      const icon = {pass:'● PASS',fail:'✗ FAIL',error:'⚠ Error'}[s] || '○';
      statusEl.className = 'test-status ' + cls;
      statusEl.textContent = icon + (data.duration_ms ? ` · ${data.duration_ms}ms` : '');

      let html = '';
      if (data.input) html += `<span class="tin">→ ${data.input}</span><br>`;
      if (data.output) html += `<span class="${s==='pass'?'tok':'tfail'}">← ${data.output}</span>`;
      if (data.error) html += `<br><span class="tfail">${data.error}</span>`;
      detailEl.innerHTML = html;
    }

    async function runAllTests() {
      if (!confirm('Run All actuates real hardware: relay channels toggle OFF→ON and ' +
                   'hub ports power-cycle. Do not run against a bench that is mid-test ' +
                   'or has a powered DUT you care about. Continue?')) return;
      for (const key of Object.keys(_tests)) {
        await runTest(key);   // sequential — avoids SSH contention and interleaved hardware actions
      }
    }

    function updateSummary() {
      const counts = {pass:0, fail:0, error:0, not_run:0};
      Object.values(_results).forEach(r => {
        const s = r.status || 'not_run';
        counts[s] = (counts[s]||0) + 1;
      });
      const el = document.getElementById('summary-counts');
      el.innerHTML = [
        counts.pass   ? `<span style="color:var(--green)">● ${counts.pass} Passed</span>` : '',
        counts.fail   ? `<span style="color:var(--red)">● ${counts.fail} Failed</span>` : '',
        counts.error  ? `<span style="color:var(--amber)">⚠ ${counts.error} Errors</span>` : '',
        counts.not_run? `<span style="color:var(--muted)">○ ${counts.not_run} Not run</span>` : '',
      ].filter(Boolean).join('') || '<span style="color:var(--muted)">No tests run</span>';
    }

    function exportReport() {
      const lines = [`# Hardware Test Report`, `Target: ${_host}`, `Date: ${new Date().toLocaleString()}`, ''];
      Object.entries(_results).forEach(([key, r]) => {
        lines.push(`## ${r.test_name || key}`);
        lines.push(`Status: ${(r.status||'').toUpperCase()}`);
        if (r.input)  lines.push(`Input:  ${r.input}`);
        if (r.output) lines.push(`Output: ${r.output}`);
        if (r.error)  lines.push(`Error:  ${r.error}`);
        lines.push('');
      });
      const blob = new Blob([lines.join('\n')], {type:'text/markdown'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `hw-test-${_host}-${new Date().toISOString().slice(0,10)}.md`;
      a.click();
    }
  </script>
</body>
</html>
